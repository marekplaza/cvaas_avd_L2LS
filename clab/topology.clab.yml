---
name: CVaaS and AVD Demo, EVPN MLAG small
prefix: ""

mgmt:
    network: custom_mgmt
    ipv4-subnet: 10.0.0.0/16

topology:
    kinds:
        ceos:
            enforce-startup-config: true
            image: arista/ceos:4.35.6M
            binds:
            - interface_mapping.json:/mnt/flash/EosIntfMapping.json:ro
            # extras.ceos-copy-to-flash under defaults is not applied by containerlab 0.76,
            # so the onboarding token is bind-mounted instead
            - cv-onboarding-token:/mnt/flash/cv-onboarding-token:ro
    defaults:
        kind: ceos
    nodes:
        marpla-s01:
            mgmt-ipv4: 10.0.1.1
            binds:
            - sn/s01.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/s01.cfg
        marpla-s02:
            mgmt-ipv4: 10.0.1.2
            binds:
            - sn/s02.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/s02.cfg
        marpla-l01:
            mgmt-ipv4: 10.0.2.1
            binds:
            - sn/l01.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/l01.cfg
        marpla-l02:
            mgmt-ipv4: 10.0.2.2
            binds:
            - sn/l02.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/l02.cfg
        marpla-l03:
            mgmt-ipv4: 10.0.2.3
            binds:
            - sn/l03.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/l03.cfg
        marpla-l04:
            mgmt-ipv4: 10.0.2.4
            binds:
            - sn/l04.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/l04.cfg
        marpla-h01:
            mgmt-ipv4: 10.0.3.1
            startup-config: init-configs/h01.cfg
        marpla-h02:
            mgmt-ipv4: 10.0.3.2
            startup-config: init-configs/h02.cfg

    links:
    - endpoints: ["marpla-l01:eth1", "marpla-s01:eth1"]
    - endpoints: ["marpla-l01:eth2", "marpla-s02:eth1"]
    - endpoints: ["marpla-l02:eth1", "marpla-s01:eth2"]
    - endpoints: ["marpla-l02:eth2", "marpla-s02:eth2"]
    - endpoints: ["marpla-l03:eth1", "marpla-s01:eth3"]
    - endpoints: ["marpla-l03:eth2", "marpla-s02:eth3"]
    - endpoints: ["marpla-l04:eth1", "marpla-s01:eth4"]
    - endpoints: ["marpla-l04:eth2", "marpla-s02:eth4"]
    - endpoints: ["marpla-l01:eth3", "marpla-l02:eth3"]
    - endpoints: ["marpla-l01:eth4", "marpla-l02:eth4"]
    - endpoints: ["marpla-l03:eth3", "marpla-l04:eth3"]
    - endpoints: ["marpla-l03:eth4", "marpla-l04:eth4"]
    - endpoints: ["marpla-h01:eth1", "marpla-l01:eth10"]
    - endpoints: ["marpla-h01:eth2", "marpla-l02:eth10"]
    - endpoints: ["marpla-h02:eth1", "marpla-l03:eth20"]
    - endpoints: ["marpla-h02:eth2", "marpla-l04:eth20"]
