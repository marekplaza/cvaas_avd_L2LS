!
no enable password
no aaa root
!
username arista privilege 15 role network-admin secret sha512 $6$GgJDMeBVxpUHjqLw$LUbUYX7pnVUjvcxoaAeGW0llEhfuX9XKiQRRx7oqFTuHUEYeFxQmDwhT.XcQvAiJsOG7YtAoTGuV7nRTBxF6r1
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=apiserver.cv-prod-euwest-2.arista.io:443 -cvauth=token-secure,/mnt/flash/cv-onboarding-token -cvvrf=MGMT -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname marpla-s02
ip domain lookup vrf MGMT source-interface Management1
ip name-server vrf MGMT 8.8.8.8
dns domain avd.lab
!
spanning-tree mode none
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no protocol http
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description P2P_marpla-l01_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 100.65.0.2/31
!
interface Ethernet2
   description P2P_marpla-l02_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 100.65.0.6/31
!
interface Ethernet3
   description P2P_marpla-l03_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 100.65.0.10/31
!
interface Ethernet4
   description P2P_marpla-l04_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 100.65.0.14/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 100.64.255.2/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 10.0.1.2/16
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 100.64.255.0/24 eq 32
!
ip route vrf MGMT 0.0.0.0/0 10.0.0.1
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT time.apple.com
ntp server vrf MGMT time.google.com prefer
ntp server vrf MGMT time.windows.com
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65100
   router-id 100.64.255.2
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS next-hop-unchanged
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 100.65.0.3 peer group IPv4-UNDERLAY-PEERS
   neighbor 100.65.0.3 remote-as 65101
   neighbor 100.65.0.3 description marpla-l01_Ethernet2
   neighbor 100.65.0.7 peer group IPv4-UNDERLAY-PEERS
   neighbor 100.65.0.7 remote-as 65101
   neighbor 100.65.0.7 description marpla-l02_Ethernet2
   neighbor 100.65.0.11 peer group IPv4-UNDERLAY-PEERS
   neighbor 100.65.0.11 remote-as 65102
   neighbor 100.65.0.11 description marpla-l03_Ethernet2
   neighbor 100.65.0.15 peer group IPv4-UNDERLAY-PEERS
   neighbor 100.65.0.15 remote-as 65102
   neighbor 100.65.0.15 description marpla-l04_Ethernet2
   neighbor 100.65.255.3 peer group EVPN-OVERLAY-PEERS
   neighbor 100.65.255.3 remote-as 65101
   neighbor 100.65.255.3 description marpla-l01_Loopback0
   neighbor 100.65.255.4 peer group EVPN-OVERLAY-PEERS
   neighbor 100.65.255.4 remote-as 65101
   neighbor 100.65.255.4 description marpla-l02_Loopback0
   neighbor 100.65.255.5 peer group EVPN-OVERLAY-PEERS
   neighbor 100.65.255.5 remote-as 65102
   neighbor 100.65.255.5 description marpla-l03_Loopback0
   neighbor 100.65.255.6 peer group EVPN-OVERLAY-PEERS
   neighbor 100.65.255.6 remote-as 65102
   neighbor 100.65.255.6 description marpla-l04_Loopback0
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
