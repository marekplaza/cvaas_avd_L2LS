aaa_root:
  disabled: true
config_end: true
daemon_terminattr:
  cvaddrs:
  - apiserver.cv-prod-euwest-2.arista.io:443
  cvauth:
    method: token-secure
    token_file: /mnt/flash/cv-onboarding-token
  cvvrf: MGMT
  disable_aaa: true
  ingestexclude: /Sysdb/cell/1/agent,/Sysdb/cell/2/agent
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
dns_domain: avd.lab
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: P2P_marpla-l01_Ethernet2
  shutdown: false
  mtu: 9214
  ip_address: 100.65.0.2/31
  metadata:
    peer: marpla-l01
    peer_interface: Ethernet2
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_marpla-l02_Ethernet2
  shutdown: false
  mtu: 9214
  ip_address: 100.65.0.6/31
  metadata:
    peer: marpla-l02
    peer_interface: Ethernet2
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet3
  description: P2P_marpla-l03_Ethernet2
  shutdown: false
  mtu: 9214
  ip_address: 100.65.0.10/31
  metadata:
    peer: marpla-l03
    peer_interface: Ethernet2
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet4
  description: P2P_marpla-l04_Ethernet2
  shutdown: false
  mtu: 9214
  ip_address: 100.65.0.14/31
  metadata:
    peer: marpla-l04
    peer_interface: Ethernet2
    peer_type: l3leaf
  switchport:
    enabled: false
hostname: marpla-s02
ip_domain_lookup:
  source_interfaces:
  - name: Management1
    vrf: MGMT
ip_name_server:
  vrfs:
  - name: MGMT
    servers:
    - ip_address: 8.8.8.8
ip_routing: true
local_users:
- name: arista
  privilege: 15
  role: network-admin
  sha512_password: $6$GgJDMeBVxpUHjqLw$LUbUYX7pnVUjvcxoaAeGW0llEhfuX9XKiQRRx7oqFTuHUEYeFxQmDwhT.XcQvAiJsOG7YtAoTGuV7nRTBxF6r1
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 100.64.255.2/32
management_api_http:
  enable_http: false
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 10.0.1.2/16
  type: oob
  gateway: 10.0.0.1
metadata:
  is_deployed: true
  platform: cEOS
  pod_name: marpla-POD1
  dc_name: marpla-DC1
  fabric_name: AVD_FABRIC
  validate_hardware:
    enabled: false
  cv_tags:
    device_tags:
    - name: topology_hint_datacenter
      value: marpla-DC1
    - name: topology_hint_fabric
      value: AVD_FABRIC
    - name: topology_hint_pod
      value: marpla-POD1
    - name: topology_hint_type
      value: spine
    - name: owner
      value: marpla
ntp:
  local_interface:
    name: Management1
    vrf: MGMT
  servers:
  - name: time.google.com
    preferred: true
  - name: time.windows.com
  - name: time.apple.com
  vrf: MGMT
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 100.64.255.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65100'
  router_id: 100.64.255.2
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    next_hop_unchanged: true
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 100.65.0.3
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: marpla-l01
    description: marpla-l01_Ethernet2
  - ip_address: 100.65.0.7
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: marpla-l02
    description: marpla-l02_Ethernet2
  - ip_address: 100.65.0.11
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65102'
    metadata:
      peer: marpla-l03
    description: marpla-l03_Ethernet2
  - ip_address: 100.65.0.15
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65102'
    metadata:
      peer: marpla-l04
    description: marpla-l04_Ethernet2
  - ip_address: 100.65.255.3
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: marpla-l01
    description: marpla-l01_Loopback0
  - ip_address: 100.65.255.4
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: marpla-l02
    description: marpla-l02_Loopback0
  - ip_address: 100.65.255.5
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65102'
    metadata:
      peer: marpla-l03
    description: marpla-l03_Loopback0
  - ip_address: 100.65.255.6
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65102'
    metadata:
      peer: marpla-l04
    description: marpla-l04_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 10.0.0.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
