---
- name: Decommission lab devices from CVaaS
  hosts: lab_cv_instance
  connection: local
  gather_facts: false
  vars:
    ansible_user: cvaas
    ansible_password: "{{ lookup('ansible.builtin.env', 'CV_API_TOKEN') }}"
    devices_to_decommission:
      - hostname: s01
        serialNumber: CAFECAFECAFE0001
        parentContainerName: s01
      - hostname: s02
        serialNumber: CAFECAFECAFE0002
        parentContainerName: s02
      - hostname: l01
        serialNumber: CAFECAFECAFE0011
        parentContainerName: l01
      - hostname: l02
        serialNumber: CAFECAFECAFE0012
        parentContainerName: l02
      - hostname: l03
        serialNumber: CAFECAFECAFE0013
        parentContainerName: l03
      - hostname: l04
        serialNumber: CAFECAFECAFE0014
        parentContainerName: l04
  tasks:

    - name: "Decommission {{ item.hostname }} (SN: {{ item.serialNumber }}) from CVaaS"
      arista.cvp.cv_device_v3:
        devices:
          - hostname: "{{ item.hostname }}"
            serialNumber: "{{ item.serialNumber }}"
            parentContainerName: "{{ item.parentContainerName }}"
        state: absent
        search_key: serialNumber
        inventory_mode: loose
      loop: "{{ devices_to_decommission }}"
      loop_control:
        label: "{{ item.hostname }}"
      async: 300
      poll: 0
      ignore_errors: true
      register: async_jobs

    - name: Wait for all decommissions to complete
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ async_jobs.results }}"
      loop_control:
        label: "{{ item.item.hostname }}"
      register: job_results
      until: job_results.finished
      retries: 30
      delay: 10
      ignore_errors: true

    - name: Decommission summary
      ansible.builtin.debug:
        msg: >-
          {{ item.item.item.hostname }} ({{ item.item.item.serialNumber }}):
          {{ 'SKIPPED — ' ~ (item.msg | default('already removed or not found'))
             if item.failed else 'OK — decommissioned' }}
      loop: "{{ job_results.results }}"
      loop_control:
        label: "{{ item.item.item.hostname }}"
