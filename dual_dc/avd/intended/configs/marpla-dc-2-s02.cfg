!
no enable password
no aaa root
!
username arista privilege 15 role network-admin secret sha512 $6$GgJDMeBVxpUHjqLw$LUbUYX7pnVUjvcxoaAeGW0llEhfuX9XKiQRRx7oqFTuHUEYeFxQmDwhT.XcQvAiJsOG7YtAoTGuV7nRTBxF6r1
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=apiserver.cv-prod-euwest-2.arista.io:443 -cvauth=token-secure,/mnt/flash/cv-onboarding-token -cvvrf=MGMT -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname marpla-dc-2-s02
ip domain lookup vrf MGMT source-interface Management1
ip name-server vrf MGMT 8.8.8.8
dns domain avd.lab
!
spanning-tree mode none
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no protocol http
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description P2P_marpla-dc-2-wew-l01_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.102.10.2/31
!
interface Ethernet2
   description P2P_marpla-dc-2-wew-l02_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.102.10.6/31
!
interface Ethernet3
   description P2P_marpla-dc-2-priv-l03_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.102.10.10/31
!
interface Ethernet4
   description P2P_marpla-dc-2-priv-l04_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.102.10.14/31
!
interface Ethernet5
   description P2P_marpla-dc-2-ext-l05_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.102.10.18/31
!
interface Ethernet6
   description P2P_marpla-dc-2-ext-l06_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.102.10.22/31
!
interface Ethernet7
   description DCI_marpla-dc-1-s02_Ethernet7
   no shutdown
   mtu 9214
   no switchport
   ip address 10.100.0.5/31
!
interface Ethernet8
   description DCI_marpla-dc-1-s01_Ethernet8
   no shutdown
   mtu 9214
   no switchport
   ip address 10.100.0.3/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.102.0.2/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 10.30.21.2/16
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-DCI-IN
   seq 10 permit 10.101.1.0/24 eq 32
   seq 20 permit 10.101.2.0/24 eq 32
!
ip prefix-list PL-DCI-OUT
   seq 10 permit 10.102.1.0/24 eq 32
   seq 20 permit 10.102.2.0/24 eq 32
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.102.0.0/24 eq 32
!
ip route vrf MGMT 0.0.0.0/0 10.30.0.1
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT time.apple.com
ntp server vrf MGMT time.google.com prefer
ntp server vrf MGMT time.windows.com
!
route-map RM-BGP-10.100.0.2-IN permit 10
   match ip address prefix-list PL-DCI-IN
!
route-map RM-BGP-10.100.0.2-OUT permit 10
   match ip address prefix-list PL-DCI-OUT
!
route-map RM-BGP-10.100.0.2-OUT deny 20
!
route-map RM-BGP-10.100.0.4-IN permit 10
   match ip address prefix-list PL-DCI-IN
!
route-map RM-BGP-10.100.0.4-OUT permit 10
   match ip address prefix-list PL-DCI-OUT
!
route-map RM-BGP-10.100.0.4-OUT deny 20
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65200
   router-id 10.102.0.2
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS next-hop-unchanged
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.100.0.2 remote-as 65100
   neighbor 10.100.0.2 description DCI_marpla-dc-1-s01_Ethernet8
   neighbor 10.100.0.2 route-map RM-BGP-10.100.0.2-IN in
   neighbor 10.100.0.2 route-map RM-BGP-10.100.0.2-OUT out
   neighbor 10.100.0.4 remote-as 65100
   neighbor 10.100.0.4 description DCI_marpla-dc-1-s02_Ethernet7
   neighbor 10.100.0.4 route-map RM-BGP-10.100.0.4-IN in
   neighbor 10.100.0.4 route-map RM-BGP-10.100.0.4-OUT out
   neighbor 10.102.1.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.102.1.1 remote-as 65201
   neighbor 10.102.1.1 description marpla-dc-2-wew-l01_Loopback0
   neighbor 10.102.1.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.102.1.2 remote-as 65201
   neighbor 10.102.1.2 description marpla-dc-2-wew-l02_Loopback0
   neighbor 10.102.1.3 peer group EVPN-OVERLAY-PEERS
   neighbor 10.102.1.3 remote-as 65202
   neighbor 10.102.1.3 description marpla-dc-2-priv-l03_Loopback0
   neighbor 10.102.1.4 peer group EVPN-OVERLAY-PEERS
   neighbor 10.102.1.4 remote-as 65202
   neighbor 10.102.1.4 description marpla-dc-2-priv-l04_Loopback0
   neighbor 10.102.1.5 peer group EVPN-OVERLAY-PEERS
   neighbor 10.102.1.5 remote-as 65203
   neighbor 10.102.1.5 description marpla-dc-2-ext-l05_Loopback0
   neighbor 10.102.1.6 peer group EVPN-OVERLAY-PEERS
   neighbor 10.102.1.6 remote-as 65203
   neighbor 10.102.1.6 description marpla-dc-2-ext-l06_Loopback0
   neighbor 10.102.10.3 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.102.10.3 remote-as 65201
   neighbor 10.102.10.3 description marpla-dc-2-wew-l01_Ethernet2
   neighbor 10.102.10.7 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.102.10.7 remote-as 65201
   neighbor 10.102.10.7 description marpla-dc-2-wew-l02_Ethernet2
   neighbor 10.102.10.11 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.102.10.11 remote-as 65202
   neighbor 10.102.10.11 description marpla-dc-2-priv-l03_Ethernet2
   neighbor 10.102.10.15 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.102.10.15 remote-as 65202
   neighbor 10.102.10.15 description marpla-dc-2-priv-l04_Ethernet2
   neighbor 10.102.10.19 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.102.10.19 remote-as 65203
   neighbor 10.102.10.19 description marpla-dc-2-ext-l05_Ethernet2
   neighbor 10.102.10.23 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.102.10.23 remote-as 65203
   neighbor 10.102.10.23 description marpla-dc-2-ext-l06_Ethernet2
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor 10.100.0.2 activate
      neighbor 10.100.0.4 activate
   !
   address-family rt-membership
      neighbor EVPN-OVERLAY-PEERS activate
      neighbor EVPN-OVERLAY-PEERS default-route-target only
!
end
