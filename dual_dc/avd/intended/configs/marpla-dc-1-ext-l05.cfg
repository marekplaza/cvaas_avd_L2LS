!
no enable password
no aaa root
!
username arista privilege 15 role network-admin secret sha512 $6$GgJDMeBVxpUHjqLw$LUbUYX7pnVUjvcxoaAeGW0llEhfuX9XKiQRRx7oqFTuHUEYeFxQmDwhT.XcQvAiJsOG7YtAoTGuV7nRTBxF6r1
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=apiserver.cv-prod-euwest-2.arista.io:443 -cvauth=token-secure,/mnt/flash/cv-onboarding-token -cvvrf=MGMT -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname marpla-dc-1-ext-l05
ip domain lookup vrf MGMT source-interface Management1
ip name-server vrf MGMT 8.8.8.8
dns domain avd.lab
!
spanning-tree mode mstp
no spanning-tree vlan-id 4093-4094
spanning-tree mst 0 priority 16384
!
vlan 110
   name EXT_FW
!
vlan 121
   name EXT_DC1_LOCAL
!
vlan 3009
   name MLAG_L3_VRF_EXT
   trunk group MLAG
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance EXT
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no protocol http
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel3
   description MLAG_marpla-dc-1-ext-l06_Port-Channel3
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Port-Channel5
   description FW_EXT
   no shutdown
   switchport trunk allowed vlan 110,121
   switchport mode trunk
   switchport
   mlag 5
!
interface Ethernet1
   description P2P_marpla-dc-1-s01_Ethernet5
   no shutdown
   mtu 9214
   no switchport
   ip address 10.101.10.17/31
!
interface Ethernet2
   description P2P_marpla-dc-1-s02_Ethernet5
   no shutdown
   mtu 9214
   no switchport
   ip address 10.101.10.19/31
!
interface Ethernet3
   description MLAG_marpla-dc-1-ext-l06_Ethernet3
   no shutdown
   channel-group 3 mode active
!
interface Ethernet4
   description MLAG_marpla-dc-1-ext-l06_Ethernet4
   no shutdown
   channel-group 3 mode active
!
interface Ethernet5
   description SERVER_marpla-dc-1-fw01_Ethernet5
   no shutdown
   channel-group 5 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.101.1.5/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.101.2.5/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 10.30.12.5/16
!
interface Vlan110
   description EXT_FW
   no shutdown
   vrf EXT
   ip address virtual 10.1.10.1/24
!
interface Vlan121
   description EXT_DC1_LOCAL
   no shutdown
   vrf EXT
   ip address virtual 10.1.21.1/24
!
interface Vlan3009
   description MLAG_L3_VRF_EXT
   no shutdown
   mtu 9214
   vrf EXT
   ip address 10.101.21.8/31
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 9214
   ip address 10.101.21.8/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.101.20.8/31
!
interface Vxlan1
   description marpla-dc-1-ext-l05_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 110 vni 1000110
   vxlan vlan 121 vni 1000121
   vxlan vrf EXT vni 1009000
!
ip virtual-router mac-address 00:1c:73:00:dc:99
!
ip routing
ip routing vrf EXT
no ip routing vrf MGMT
!
ip as-path access-list AS-RTC-LOCAL permit ^$ any
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.101.1.0/24 eq 32
   seq 20 permit 10.101.2.0/24 eq 32
!
ip prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 10.101.21.8/31
!
mlag configuration
   domain-id dc1-ext
   local-interface Vlan4094
   peer-address 10.101.20.9
   peer-link Port-Channel3
   reload-delay mlag 300
   reload-delay non-mlag 330
!
ip route vrf MGMT 0.0.0.0/0 10.30.0.1
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT time.apple.com
ntp server vrf MGMT time.google.com prefer
ntp server vrf MGMT time.windows.com
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
route-map RM-RTC-LOCAL-ONLY permit 10
   description only RT memberships originated by this gateway
   match as-path AS-RTC-LOCAL
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65103
   router-id 10.101.1.5
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-CORE peer group
   neighbor EVPN-OVERLAY-CORE update-source Loopback0
   neighbor EVPN-OVERLAY-CORE bfd
   neighbor EVPN-OVERLAY-CORE ebgp-multihop 15
   neighbor EVPN-OVERLAY-CORE send-community
   neighbor EVPN-OVERLAY-CORE maximum-routes 0
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65103
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description marpla-dc-1-ext-l06
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   neighbor 10.101.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.101.0.1 remote-as 65100
   neighbor 10.101.0.1 description marpla-dc-1-s01_Loopback0
   neighbor 10.101.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.101.0.2 remote-as 65100
   neighbor 10.101.0.2 description marpla-dc-1-s02_Loopback0
   neighbor 10.101.10.16 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.101.10.16 remote-as 65100
   neighbor 10.101.10.16 description marpla-dc-1-s01_Ethernet5
   neighbor 10.101.10.18 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.101.10.18 remote-as 65100
   neighbor 10.101.10.18 description marpla-dc-1-s02_Ethernet5
   neighbor 10.101.21.9 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 10.101.21.9 description marpla-dc-1-ext-l06_Vlan4093
   neighbor 10.102.1.5 peer group EVPN-OVERLAY-CORE
   neighbor 10.102.1.5 remote-as 65203
   neighbor 10.102.1.5 description marpla-dc-2-ext-l05
   neighbor 10.102.1.6 peer group EVPN-OVERLAY-CORE
   neighbor 10.102.1.6 remote-as 65203
   neighbor 10.102.1.6 description marpla-dc-2-ext-l06
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 110
      rd 10.101.1.5:110
      rd evpn domain remote 10.101.1.5:110
      route-target both 110:110
      route-target import export evpn domain remote 110:110
      redistribute learned
   !
   vlan 121
      rd 10.101.1.5:121
      route-target both 121:121
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-CORE activate
      neighbor EVPN-OVERLAY-CORE domain remote
      neighbor EVPN-OVERLAY-PEERS activate
      neighbor default next-hop-self received-evpn-routes route-type ip-prefix inter-domain
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-CORE activate
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
   !
   address-family rt-membership
      neighbor EVPN-OVERLAY-CORE activate
      neighbor EVPN-OVERLAY-PEERS activate
   !
   vrf EXT
      rd 10.101.1.5:10
      route-target import evpn 10:10
      route-target export evpn 10:10
      router-id 10.101.1.5
      neighbor 10.101.21.9 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 10.101.21.9 description marpla-dc-1-ext-l06_Vlan3009
      redistribute connected route-map RM-CONN-2-BGP-VRFS
!
router bgp 65103
   address-family rt-membership
      neighbor EVPN-OVERLAY-PEERS route-map RM-RTC-LOCAL-ONLY out
      neighbor EVPN-OVERLAY-CORE route-map RM-RTC-LOCAL-ONLY out

!
end
