!
no enable password
no aaa root
!
username arista privilege 15 role network-admin secret sha512 $6$GgJDMeBVxpUHjqLw$LUbUYX7pnVUjvcxoaAeGW0llEhfuX9XKiQRRx7oqFTuHUEYeFxQmDwhT.XcQvAiJsOG7YtAoTGuV7nRTBxF6r1
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=apiserver.cv-prod-euwest-2.arista.io:443 -cvauth=token-secure,/mnt/flash/cv-onboarding-token -cvvrf=MGMT -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname marpla-dc-2-wew-l01
ip domain lookup vrf MGMT source-interface Management1
ip name-server vrf MGMT 8.8.8.8
dns domain avd.lab
!
spanning-tree mode mstp
no spanning-tree vlan-id 4093-4094
spanning-tree mst 0 priority 16384
!
vlan 210
   name WEW_FW
!
vlan 222
   name WEW_DC2_LOCAL
!
vlan 3019
   name MLAG_L3_VRF_WEW
   trunk group MLAG
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
vrf instance WEW
!
management api http-commands
   protocol https
   no protocol http
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel3
   description MLAG_marpla-dc-2-wew-l02_Port-Channel3
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Port-Channel5
   description FW_WEW
   no shutdown
   switchport trunk allowed vlan 210,222
   switchport mode trunk
   switchport
   mlag 5
!
interface Ethernet1
   description P2P_marpla-dc-2-s01_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.102.10.1/31
!
interface Ethernet2
   description P2P_marpla-dc-2-s02_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.102.10.3/31
!
interface Ethernet3
   description MLAG_marpla-dc-2-wew-l02_Ethernet3
   no shutdown
   channel-group 3 mode active
!
interface Ethernet4
   description MLAG_marpla-dc-2-wew-l02_Ethernet4
   no shutdown
   channel-group 3 mode active
!
interface Ethernet5
   description SERVER_marpla-dc-2-fw01_Ethernet1
   no shutdown
   channel-group 5 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.102.1.1/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.102.2.1/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 10.30.22.1/16
!
interface Vlan210
   description WEW_FW
   no shutdown
   vrf WEW
   ip address virtual 10.2.10.1/24
!
interface Vlan222
   description WEW_DC2_LOCAL
   no shutdown
   vrf WEW
   ip address virtual 10.2.22.1/24
!
interface Vlan3019
   description MLAG_L3_VRF_WEW
   no shutdown
   mtu 9214
   vrf WEW
   ip address 10.102.21.0/31
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 9214
   ip address 10.102.21.0/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.102.20.0/31
!
interface Vxlan1
   description marpla-dc-2-wew-l01_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 210 vni 2000210
   vxlan vlan 222 vni 2000222
   vxlan vrf WEW vni 2009000
!
ip virtual-router mac-address 00:1c:73:00:dc:99
!
ip routing
no ip routing vrf MGMT
ip routing vrf WEW
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.102.1.0/24 eq 32
   seq 20 permit 10.102.2.0/24 eq 32
!
ip prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 10.102.21.0/31
!
mlag configuration
   domain-id dc2-wew
   local-interface Vlan4094
   peer-address 10.102.20.1
   peer-link Port-Channel3
   reload-delay mlag 300
   reload-delay non-mlag 330
!
ip route vrf MGMT 0.0.0.0/0 10.30.0.1
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT time.apple.com
ntp server vrf MGMT time.google.com prefer
ntp server vrf MGMT time.windows.com
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65201
   router-id 10.102.1.1
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65201
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description marpla-dc-2-wew-l02
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   neighbor 10.102.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.102.0.1 remote-as 65200
   neighbor 10.102.0.1 description marpla-dc-2-s01_Loopback0
   neighbor 10.102.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.102.0.2 remote-as 65200
   neighbor 10.102.0.2 description marpla-dc-2-s02_Loopback0
   neighbor 10.102.10.0 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.102.10.0 remote-as 65200
   neighbor 10.102.10.0 description marpla-dc-2-s01_Ethernet1
   neighbor 10.102.10.2 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.102.10.2 remote-as 65200
   neighbor 10.102.10.2 description marpla-dc-2-s02_Ethernet1
   neighbor 10.102.21.1 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 10.102.21.1 description marpla-dc-2-wew-l02_Vlan4093
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 210
      rd 10.102.1.1:210
      route-target both 210:210
      redistribute learned
   !
   vlan 222
      rd 10.102.1.1:222
      route-target both 222:222
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
   !
   address-family rt-membership
      neighbor EVPN-OVERLAY-PEERS activate
   !
   vrf WEW
      rd 10.102.1.1:20
      route-target import evpn 20:20
      route-target export evpn 20:20
      router-id 10.102.1.1
      neighbor 10.102.21.1 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 10.102.21.1 description marpla-dc-2-wew-l02_Vlan3019
      redistribute connected route-map RM-CONN-2-BGP-VRFS
!
end
