    match:
    - ip address prefix-list PL-DCI-OUT
  - sequence: 20
    type: deny
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
