prefix_lists:
- name: PL-DCI-IN
  sequence_numbers:
  - sequence: 10
    action: permit 10.102.0.0/24 eq 32
  - sequence: 20
    action: permit 10.102.3.0/24 eq 32
- name: PL-DCI-OUT
  sequence_numbers:
  - sequence: 10
    action: permit 10.101.0.0/24 eq 32
  - sequence: 20
    action: permit 10.101.3.0/24 eq 32
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.101.0.0/24 eq 32
  - sequence: 20
    action: permit 10.101.3.0/24 eq 32
route_maps:
- name: RM-BGP-10.100.0.5-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-DCI-IN
- name: RM-BGP-10.100.0.5-OUT
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-DCI-OUT
  - sequence: 20
    type: deny
- name: RM-BGP-10.100.0.7-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-DCI-IN
- name: RM-BGP-10.100.0.7-OUT
