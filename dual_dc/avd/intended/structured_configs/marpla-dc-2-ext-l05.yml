mlag_configuration:
  domain_id: dc2-ext
  local_interface: Vlan4094
  peer_address: 10.102.20.9
  peer_link: Port-Channel3
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
ntp:
  local_interface:
    name: Management1
    vrf: MGMT
  servers:
  - name: time.google.com
    preferred: true
  - name: time.windows.com
  - name: time.apple.com
  vrf: MGMT
port_channel_interfaces:
- name: Port-Channel3
  description: MLAG_marpla-dc-2-ext-l06_Port-Channel3
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel5
  description: FW_EXT
  shutdown: false
  mlag: 5
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 110,122
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.102.1.0/24 eq 32
  - sequence: 20
    action: permit 10.102.2.0/24 eq 32
- name: PL-MLAG-PEER-VRFS
  sequence_numbers:
  - sequence: 10
    action: permit 10.102.21.8/31
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
- name: RM-CONN-2-BGP-VRFS
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - ip address prefix-list PL-MLAG-PEER-VRFS
  - sequence: 20
    type: permit
- name: RM-RTC-LOCAL-ONLY
  sequence_numbers:
  - sequence: 10
    type: permit
    description: only RT memberships originated by this gateway
    match:
    - as-path AS-RTC-LOCAL
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65203'
  router_id: 10.102.1.5
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65203'
    description: marpla-dc-2-ext-l06
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  - name: EVPN-OVERLAY-CORE
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 15
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.102.21.9
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      peer: marpla-dc-2-ext-l06
    description: marpla-dc-2-ext-l06_Vlan4093
  - ip_address: 10.102.10.16
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: marpla-dc-2-s01
    description: marpla-dc-2-s01_Ethernet5
  - ip_address: 10.102.10.18
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: marpla-dc-2-s02
    description: marpla-dc-2-s02_Ethernet5
  - ip_address: 10.102.0.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: marpla-dc-2-s01
    description: marpla-dc-2-s01_Loopback0
  - ip_address: 10.102.0.2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: marpla-dc-2-s02
    description: marpla-dc-2-s02_Loopback0
  - ip_address: 10.101.1.5
    peer_group: EVPN-OVERLAY-CORE
    remote_as: '65103'
    metadata:
      peer: marpla-dc-1-ext-l05
    description: marpla-dc-1-ext-l05
  - ip_address: 10.101.1.6
    peer_group: EVPN-OVERLAY-CORE
    remote_as: '65103'
    metadata:
      peer: marpla-dc-1-ext-l06
    description: marpla-dc-1-ext-l06
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 110
    metadata:
      tenants:
      - EXT
    rd: 10.102.1.5:110
    rd_evpn_domain:
      domain: remote
      rd: 10.102.1.5:110
    route_targets:
      both:
      - 110:110
      import_export_evpn_domains:
      - domain: remote
        route_target: 110:110
    redistribute_routes:
    - learned
  - id: 122
    metadata:
      tenants:
      - EXT
    rd: 10.102.1.5:122
    route_targets:
      both:
      - 122:122
    redistribute_routes:
    - learned
  address_family_evpn:
    neighbor_default:
      next_hop_self_received_evpn_routes:
        enable: true
        inter_domain: true
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-CORE
      activate: true
      domain_remote: true
  address_family_rtc:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-CORE
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
    - name: EVPN-OVERLAY-CORE
      activate: false
  vrfs:
  - name: EXT
    rd: 10.102.1.5:10
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '10:10'
      export:
      - address_family: evpn
        route_targets:
        - '10:10'
    router_id: 10.102.1.5
    neighbors:
    - ip_address: 10.102.21.9
      peer_group: MLAG-IPv4-UNDERLAY-PEER
      description: marpla-dc-2-ext-l06_Vlan3009
    redistribute:
      connected:
        enabled: true
        route_map: RM-CONN-2-BGP-VRFS
