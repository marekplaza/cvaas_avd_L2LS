mlag_configuration:
  domain_id: dc1-priv
  local_interface: Vlan4094
  peer_address: 10.101.20.4
  peer_link: Port-Channel3
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
ntp:
  local_interface:
    name: Management1
    vrf: MGMT
  servers:
  - name: time.google.com
    preferred: true
  - name: time.windows.com
  - name: time.apple.com
  vrf: MGMT
port_channel_interfaces:
- name: Port-Channel3
  description: MLAG_marpla-dc-1-priv-l03_Port-Channel3
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel5
  description: FW_PRIV
  shutdown: false
  mlag: 5
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 310,321,399
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.101.1.0/24 eq 32
  - sequence: 20
    action: permit 10.101.2.0/24 eq 32
- name: PL-MLAG-PEER-VRFS
  sequence_numbers:
  - sequence: 10
    action: permit 10.101.21.4/31
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
- name: RM-CONN-2-BGP-VRFS
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - ip address prefix-list PL-MLAG-PEER-VRFS
  - sequence: 20
    type: permit
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65102'
  router_id: 10.101.1.4
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65102'
    description: marpla-dc-1-priv-l03
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.101.21.4
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      peer: marpla-dc-1-priv-l03
    description: marpla-dc-1-priv-l03_Vlan4093
  - ip_address: 10.101.10.12
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: marpla-dc-1-s01
    description: marpla-dc-1-s01_Ethernet4
  - ip_address: 10.101.10.14
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: marpla-dc-1-s02
    description: marpla-dc-1-s02_Ethernet4
  - ip_address: 10.101.0.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: marpla-dc-1-s01
    description: marpla-dc-1-s01_Loopback0
  - ip_address: 10.101.0.2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: marpla-dc-1-s02
    description: marpla-dc-1-s02_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 310
    metadata:
      tenants:
      - PRIV
    rd: 10.101.1.4:310
    route_targets:
      both:
      - 310:310
    redistribute_routes:
    - learned
  - id: 321
    metadata:
      tenants:
      - PRIV
    rd: 10.101.1.4:321
    route_targets:
      both:
      - 321:321
    redistribute_routes:
    - learned
  - id: 399
    metadata:
      tenants:
      - PRIV
    rd: 10.101.1.4:399
    route_targets:
      both:
      - 399:399
    redistribute_routes:
    - learned
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: PRIV
    rd: 10.101.1.4:30
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '30:30'
      export:
      - address_family: evpn
        route_targets:
        - '30:30'
    router_id: 10.101.1.4
    neighbors:
    - ip_address: 10.101.21.4
      peer_group: MLAG-IPv4-UNDERLAY-PEER
      description: marpla-dc-1-priv-l03_Vlan3029
    redistribute:
      connected:
        enabled: true
        route_map: RM-CONN-2-BGP-VRFS
