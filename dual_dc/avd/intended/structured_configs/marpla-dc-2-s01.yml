    name: Management1
    vrf: MGMT
  servers:
  - name: time.google.com
    preferred: true
  - name: time.windows.com
  - name: time.apple.com
  vrf: MGMT
prefix_lists:
- name: PL-DCI-IN
  sequence_numbers:
  - sequence: 10
    action: permit 10.101.1.0/24 eq 32
  - sequence: 20
    action: permit 10.101.2.0/24 eq 32
- name: PL-DCI-OUT
  sequence_numbers:
  - sequence: 10
    action: permit 10.102.1.0/24 eq 32
  - sequence: 20
    action: permit 10.102.2.0/24 eq 32
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.102.0.0/24 eq 32
route_maps:
- name: RM-BGP-10.100.0.0-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-DCI-IN
- name: RM-BGP-10.100.0.0-OUT
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-DCI-OUT
  - sequence: 20
    type: deny
- name: RM-BGP-10.100.0.6-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-DCI-IN
- name: RM-BGP-10.100.0.6-OUT
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-DCI-OUT
  - sequence: 20
    type: deny
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65200'
  router_id: 10.102.0.1
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    next_hop_unchanged: true
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.100.0.0
    remote_as: '65100'
    description: DCI_marpla-dc-1-s01_Ethernet7
    route_map_in: RM-BGP-10.100.0.0-IN
    route_map_out: RM-BGP-10.100.0.0-OUT
  - ip_address: 10.100.0.6
    remote_as: '65100'
    description: DCI_marpla-dc-1-s02_Ethernet8
    route_map_in: RM-BGP-10.100.0.6-IN
    route_map_out: RM-BGP-10.100.0.6-OUT
  - ip_address: 10.102.10.1
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65201'
    metadata:
      peer: marpla-dc-2-wew-l01
