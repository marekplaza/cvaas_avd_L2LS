    token_file: /mnt/flash/cv-onboarding-token
  cvvrf: MGMT
  disable_aaa: true
  ingestexclude: /Sysdb/cell/1/agent,/Sysdb/cell/2/agent
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
dns_domain: avd.lab
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet3
  description: MLAG_marpla-dc-2-wew-l02_Ethernet3
  shutdown: false
  channel_group:
    id: 3
    mode: active
  metadata:
    peer: marpla-dc-2-wew-l02
    peer_interface: Ethernet3
    peer_type: mlag_peer
- name: Ethernet4
  description: MLAG_marpla-dc-2-wew-l02_Ethernet4
  shutdown: false
  channel_group:
    id: 3
    mode: active
  metadata:
    peer: marpla-dc-2-wew-l02
    peer_interface: Ethernet4
    peer_type: mlag_peer
- name: Ethernet1
  description: P2P_marpla-dc-2-s01_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.102.10.1/31
  metadata:
    peer: marpla-dc-2-s01
    peer_interface: Ethernet1
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_marpla-dc-2-s02_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.102.10.3/31
  metadata:
    peer: marpla-dc-2-s02
    peer_interface: Ethernet1
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet5
  description: SERVER_marpla-dc-2-fw01_Ethernet1
