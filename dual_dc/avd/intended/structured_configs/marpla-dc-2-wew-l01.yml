  channel_group:
    id: 5
    mode: active
  metadata:
    peer: marpla-dc-2-fw01
    peer_interface: Ethernet1
    peer_type: server
    peer_key: servers
hostname: marpla-dc-2-wew-l01
ip_domain_lookup:
  source_interfaces:
  - name: Management1
    vrf: MGMT
ip_igmp_snooping:
  globally_enabled: true
ip_name_server:
  vrfs:
  - name: MGMT
    servers:
    - ip_address: 8.8.8.8
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:dc:99
local_users:
- name: arista
  privilege: 15
  role: network-admin
  sha512_password: $6$GgJDMeBVxpUHjqLw$LUbUYX7pnVUjvcxoaAeGW0llEhfuX9XKiQRRx7oqFTuHUEYeFxQmDwhT.XcQvAiJsOG7YtAoTGuV7nRTBxF6r1
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.102.1.1/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.102.2.1/32
management_api_http:
  enable_http: false
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 10.30.22.1/16
  type: oob
  gateway: 10.30.0.1
metadata:
  is_deployed: true
  platform: cEOS
  pod_name: marpla-DC2-POD1
  dc_name: marpla-DC2
  fabric_name: MARPLA_DC2
  validate_hardware:
    enabled: false
  cv_tags:
    device_tags:
    - name: topology_hint_datacenter
      value: marpla-DC2
    - name: topology_hint_fabric
      value: MARPLA_DC2
    - name: topology_hint_pod
      value: marpla-DC2-POD1
    - name: topology_hint_type
      value: leaf
    - name: topology_hint_rack
      value: dc2-wew
    - name: owner
      value: marpla
    - name: dmz
      value: wew
mlag_configuration:
  domain_id: dc2-wew
  local_interface: Vlan4094
  peer_address: 10.102.20.1
  peer_link: Port-Channel3
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
ntp:
  local_interface:
    name: Management1
    vrf: MGMT
  servers:
  - name: time.google.com
    preferred: true
  - name: time.windows.com
  - name: time.apple.com
  vrf: MGMT
port_channel_interfaces:
- name: Port-Channel3
  description: MLAG_marpla-dc-2-wew-l02_Port-Channel3
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel5
  description: FW_WEW
  shutdown: false
  mlag: 5
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 210,222
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.102.1.0/24 eq 32
  - sequence: 20
    action: permit 10.102.2.0/24 eq 32
- name: PL-MLAG-PEER-VRFS
  sequence_numbers:
  - sequence: 10
    action: permit 10.102.21.0/31
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
- name: RM-CONN-2-BGP-VRFS
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - ip address prefix-list PL-MLAG-PEER-VRFS
  - sequence: 20
    type: permit
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65201'
  router_id: 10.102.1.1
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65201'
    description: marpla-dc-2-wew-l02
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.102.21.1
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      peer: marpla-dc-2-wew-l02
    description: marpla-dc-2-wew-l02_Vlan4093
  - ip_address: 10.102.10.0
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: marpla-dc-2-s01
    description: marpla-dc-2-s01_Ethernet1
  - ip_address: 10.102.10.2
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: marpla-dc-2-s02
    description: marpla-dc-2-s02_Ethernet1
  - ip_address: 10.102.0.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: marpla-dc-2-s01
    description: marpla-dc-2-s01_Loopback0
  - ip_address: 10.102.0.2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: marpla-dc-2-s02
    description: marpla-dc-2-s02_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 210
    metadata:
      tenants:
      - WEW
    rd: 10.102.1.1:210
    route_targets:
      both:
      - 210:210
    redistribute_routes:
    - learned
  - id: 222
    metadata:
      tenants:
      - WEW
    rd: 10.102.1.1:222
    route_targets:
      both:
      - 222:222
    redistribute_routes:
    - learned
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: WEW
    rd: 10.102.1.1:20
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '20:20'
      export:
      - address_family: evpn
        route_targets:
        - '20:20'
    router_id: 10.102.1.1
    neighbors:
    - ip_address: 10.102.21.1
      peer_group: MLAG-IPv4-UNDERLAY-PEER
      description: marpla-dc-2-wew-l02_Vlan3019
    redistribute:
      connected:
        enabled: true
        route_map: RM-CONN-2-BGP-VRFS
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
