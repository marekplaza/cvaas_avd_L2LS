---
- name: Deploy Configs via CVP
  hosts: MARPLA_DCS
  connection: local
  gather_facts: false
  vars:
    cv_server: "{{ lookup('ansible.builtin.env', 'CVURL', default='www.cv-prod-euwest-2.arista.io') }}"
    cv_token: "{{ lookup('ansible.builtin.env', 'CV_API_TOKEN') }}"
    cv_verify_certs: false
    cv_submit_workspace: true
    # approve, start and wait for the change control (no manual step in CVaaS)
    cv_run_change_control: true
  tasks:

    - name: Deploy configs generated by AVD on CVP
      ansible.builtin.import_role:
        name: arista.avd.cv_deploy
