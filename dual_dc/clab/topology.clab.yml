---
name: marpla-dual-dc
prefix: ""

mgmt:
    network: marpla_dualdc_mgmt
    ipv4-subnet: 10.30.0.0/16

topology:
    kinds:
        ceos:
            enforce-startup-config: true
            image: arista/ceos:4.35.6M
            binds:
            - interface_mapping.json:/mnt/flash/EosIntfMapping.json:ro
            # same CVaaS onboarding token as the single-DC lab
            - ../../clab/cv-onboarding-token:/mnt/flash/cv-onboarding-token:ro
    defaults:
        kind: ceos
    # graph-* labels: layout for the containerlab VS Code TopoViewer and `containerlab graph`
    # (level 1 = EVPN gateways/spines, 2 = leaf pairs, 3 = firewall node). Horizontal and mirrored:
    # FW1 | DC1 leaf pairs (l01 above l02) | DC1 spines | DC2 spines | DC2 leaf pairs | FW2
    nodes:
        marpla-dc-1-s01:
            mgmt-ipv4: 10.30.11.1
            labels:
                graph-level: "1"
                graph-icon: spine
                graph-group: dc1-gateways
                graph-posX: "480"
                graph-posY: "120"
            binds:
            - sn/marpla-dc-1-s01.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/marpla-dc-1-s01.cfg
        marpla-dc-1-s02:
            mgmt-ipv4: 10.30.11.2
            labels:
                graph-level: "1"
                graph-icon: spine
                graph-group: dc1-gateways
                graph-posX: "480"
                graph-posY: "340"
            binds:
            - sn/marpla-dc-1-s02.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/marpla-dc-1-s02.cfg
        marpla-dc-1-wew-l01:
            mgmt-ipv4: 10.30.12.1
            labels:
                graph-level: "2"
                graph-icon: leaf
                graph-group: dc1-wew
                graph-posX: "260"
                graph-posY: "0"
            binds:
            - sn/marpla-dc-1-wew-l01.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/marpla-dc-1-wew-l01.cfg
        marpla-dc-1-wew-l02:
            mgmt-ipv4: 10.30.12.2
            labels:
                graph-level: "2"
                graph-icon: leaf
                graph-group: dc1-wew
                graph-posX: "260"
                graph-posY: "80"
            binds:
            - sn/marpla-dc-1-wew-l02.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/marpla-dc-1-wew-l02.cfg
        marpla-dc-1-priv-l03:
            mgmt-ipv4: 10.30.12.3
            labels:
                graph-level: "2"
                graph-icon: leaf
                graph-group: dc1-priv
                graph-posX: "260"
                graph-posY: "220"
            binds:
            - sn/marpla-dc-1-priv-l03.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/marpla-dc-1-priv-l03.cfg
        marpla-dc-1-priv-l04:
            mgmt-ipv4: 10.30.12.4
            labels:
                graph-level: "2"
                graph-icon: leaf
                graph-group: dc1-priv
                graph-posX: "260"
                graph-posY: "300"
            binds:
            - sn/marpla-dc-1-priv-l04.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/marpla-dc-1-priv-l04.cfg
        marpla-dc-1-ext-l05:
            mgmt-ipv4: 10.30.12.5
            labels:
                graph-level: "2"
                graph-icon: leaf
                graph-group: dc1-ext
                graph-posX: "260"
                graph-posY: "440"
            binds:
            - sn/marpla-dc-1-ext-l05.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/marpla-dc-1-ext-l05.cfg
        marpla-dc-1-ext-l06:
            mgmt-ipv4: 10.30.12.6
            labels:
                graph-level: "2"
                graph-icon: leaf
                graph-group: dc1-ext
                graph-posX: "260"
                graph-posY: "520"
            binds:
            - sn/marpla-dc-1-ext-l06.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/marpla-dc-1-ext-l06.cfg
        marpla-dc-2-s01:
            mgmt-ipv4: 10.30.21.1
            labels:
                graph-level: "1"
                graph-icon: spine
                graph-group: dc2-gateways
                graph-posX: "840"
                graph-posY: "120"
            binds:
            - sn/marpla-dc-2-s01.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/marpla-dc-2-s01.cfg
        marpla-dc-2-s02:
            mgmt-ipv4: 10.30.21.2
            labels:
                graph-level: "1"
                graph-icon: spine
                graph-group: dc2-gateways
                graph-posX: "840"
                graph-posY: "340"
            binds:
            - sn/marpla-dc-2-s02.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/marpla-dc-2-s02.cfg
        marpla-dc-2-wew-l01:
            mgmt-ipv4: 10.30.22.1
            labels:
                graph-level: "2"
                graph-icon: leaf
                graph-group: dc2-wew
                graph-posX: "1040"
                graph-posY: "0"
            binds:
            - sn/marpla-dc-2-wew-l01.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/marpla-dc-2-wew-l01.cfg
        marpla-dc-2-wew-l02:
            mgmt-ipv4: 10.30.22.2
            labels:
                graph-level: "2"
                graph-icon: leaf
                graph-group: dc2-wew
                graph-posX: "1040"
                graph-posY: "80"
            binds:
            - sn/marpla-dc-2-wew-l02.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/marpla-dc-2-wew-l02.cfg
        marpla-dc-2-priv-l03:
            mgmt-ipv4: 10.30.22.3
            labels:
                graph-level: "2"
                graph-icon: leaf
                graph-group: dc2-priv
                graph-posX: "1040"
                graph-posY: "220"
            binds:
            - sn/marpla-dc-2-priv-l03.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/marpla-dc-2-priv-l03.cfg
        marpla-dc-2-priv-l04:
            mgmt-ipv4: 10.30.22.4
            labels:
                graph-level: "2"
                graph-icon: leaf
                graph-group: dc2-priv
                graph-posX: "1040"
                graph-posY: "300"
            binds:
            - sn/marpla-dc-2-priv-l04.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/marpla-dc-2-priv-l04.cfg
        marpla-dc-2-ext-l05:
            mgmt-ipv4: 10.30.22.5
            labels:
                graph-level: "2"
                graph-icon: leaf
                graph-group: dc2-ext
                graph-posX: "1040"
                graph-posY: "440"
            binds:
            - sn/marpla-dc-2-ext-l05.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/marpla-dc-2-ext-l05.cfg
        marpla-dc-2-ext-l06:
            mgmt-ipv4: 10.30.22.6
            labels:
                graph-level: "2"
                graph-icon: leaf
                graph-group: dc2-ext
                graph-posX: "1040"
                graph-posY: "520"
            binds:
            - sn/marpla-dc-2-ext-l06.txt:/mnt/flash/ceos-config:ro
            startup-config: init-configs/marpla-dc-2-ext-l06.cfg
        marpla-dc-1-fw01:
            mgmt-ipv4: 10.30.19.1
            labels:
                graph-level: "3"
                graph-icon: firewall
                graph-group: dc1-fw
                graph-posX: "-180"
                graph-posY: "260"
            startup-config: init-configs/marpla-dc-1-fw01.cfg
        marpla-dc-2-fw01:
            mgmt-ipv4: 10.30.29.1
            labels:
                graph-level: "3"
                graph-icon: firewall
                graph-group: dc2-fw
                graph-posX: "1520"
                graph-posY: "260"
            startup-config: init-configs/marpla-dc-2-fw01.cfg

    links:
    # DC1 leaf uplinks
    - endpoints: ["marpla-dc-1-wew-l01:eth1", "marpla-dc-1-s01:eth1"]
    - endpoints: ["marpla-dc-1-wew-l01:eth2", "marpla-dc-1-s02:eth1"]
    - endpoints: ["marpla-dc-1-wew-l02:eth1", "marpla-dc-1-s01:eth2"]
    - endpoints: ["marpla-dc-1-wew-l02:eth2", "marpla-dc-1-s02:eth2"]
    - endpoints: ["marpla-dc-1-priv-l03:eth1", "marpla-dc-1-s01:eth3"]
    - endpoints: ["marpla-dc-1-priv-l03:eth2", "marpla-dc-1-s02:eth3"]
    - endpoints: ["marpla-dc-1-priv-l04:eth1", "marpla-dc-1-s01:eth4"]
    - endpoints: ["marpla-dc-1-priv-l04:eth2", "marpla-dc-1-s02:eth4"]
    - endpoints: ["marpla-dc-1-ext-l05:eth1", "marpla-dc-1-s01:eth5"]
    - endpoints: ["marpla-dc-1-ext-l05:eth2", "marpla-dc-1-s02:eth5"]
    - endpoints: ["marpla-dc-1-ext-l06:eth1", "marpla-dc-1-s01:eth6"]
    - endpoints: ["marpla-dc-1-ext-l06:eth2", "marpla-dc-1-s02:eth6"]
    # DC1 MLAG peer-links
    - endpoints: ["marpla-dc-1-wew-l01:eth3", "marpla-dc-1-wew-l02:eth3"]
    - endpoints: ["marpla-dc-1-wew-l01:eth4", "marpla-dc-1-wew-l02:eth4"]
    - endpoints: ["marpla-dc-1-priv-l03:eth3", "marpla-dc-1-priv-l04:eth3"]
    - endpoints: ["marpla-dc-1-priv-l03:eth4", "marpla-dc-1-priv-l04:eth4"]
    - endpoints: ["marpla-dc-1-ext-l05:eth3", "marpla-dc-1-ext-l06:eth3"]
    - endpoints: ["marpla-dc-1-ext-l05:eth4", "marpla-dc-1-ext-l06:eth4"]
    # DC1 firewall node -> every zone leaf pair
    - endpoints: ["marpla-dc-1-fw01:eth1", "marpla-dc-1-wew-l01:eth5"]
    - endpoints: ["marpla-dc-1-fw01:eth2", "marpla-dc-1-wew-l02:eth5"]
    - endpoints: ["marpla-dc-1-fw01:eth3", "marpla-dc-1-priv-l03:eth5"]
    - endpoints: ["marpla-dc-1-fw01:eth4", "marpla-dc-1-priv-l04:eth5"]
    - endpoints: ["marpla-dc-1-fw01:eth5", "marpla-dc-1-ext-l05:eth5"]
    - endpoints: ["marpla-dc-1-fw01:eth6", "marpla-dc-1-ext-l06:eth5"]
    # DC2 leaf uplinks
    - endpoints: ["marpla-dc-2-wew-l01:eth1", "marpla-dc-2-s01:eth1"]
    - endpoints: ["marpla-dc-2-wew-l01:eth2", "marpla-dc-2-s02:eth1"]
    - endpoints: ["marpla-dc-2-wew-l02:eth1", "marpla-dc-2-s01:eth2"]
    - endpoints: ["marpla-dc-2-wew-l02:eth2", "marpla-dc-2-s02:eth2"]
    - endpoints: ["marpla-dc-2-priv-l03:eth1", "marpla-dc-2-s01:eth3"]
    - endpoints: ["marpla-dc-2-priv-l03:eth2", "marpla-dc-2-s02:eth3"]
    - endpoints: ["marpla-dc-2-priv-l04:eth1", "marpla-dc-2-s01:eth4"]
    - endpoints: ["marpla-dc-2-priv-l04:eth2", "marpla-dc-2-s02:eth4"]
    - endpoints: ["marpla-dc-2-ext-l05:eth1", "marpla-dc-2-s01:eth5"]
    - endpoints: ["marpla-dc-2-ext-l05:eth2", "marpla-dc-2-s02:eth5"]
    - endpoints: ["marpla-dc-2-ext-l06:eth1", "marpla-dc-2-s01:eth6"]
    - endpoints: ["marpla-dc-2-ext-l06:eth2", "marpla-dc-2-s02:eth6"]
    # DC2 MLAG peer-links
    - endpoints: ["marpla-dc-2-wew-l01:eth3", "marpla-dc-2-wew-l02:eth3"]
    - endpoints: ["marpla-dc-2-wew-l01:eth4", "marpla-dc-2-wew-l02:eth4"]
    - endpoints: ["marpla-dc-2-priv-l03:eth3", "marpla-dc-2-priv-l04:eth3"]
    - endpoints: ["marpla-dc-2-priv-l03:eth4", "marpla-dc-2-priv-l04:eth4"]
    - endpoints: ["marpla-dc-2-ext-l05:eth3", "marpla-dc-2-ext-l06:eth3"]
    - endpoints: ["marpla-dc-2-ext-l05:eth4", "marpla-dc-2-ext-l06:eth4"]
    # DC2 firewall node -> every zone leaf pair
    - endpoints: ["marpla-dc-2-fw01:eth1", "marpla-dc-2-wew-l01:eth5"]
    - endpoints: ["marpla-dc-2-fw01:eth2", "marpla-dc-2-wew-l02:eth5"]
    - endpoints: ["marpla-dc-2-fw01:eth3", "marpla-dc-2-priv-l03:eth5"]
    - endpoints: ["marpla-dc-2-fw01:eth4", "marpla-dc-2-priv-l04:eth5"]
    - endpoints: ["marpla-dc-2-fw01:eth5", "marpla-dc-2-ext-l05:eth5"]
    - endpoints: ["marpla-dc-2-fw01:eth6", "marpla-dc-2-ext-l06:eth5"]
    # Gateway peer links: iBGP IPv4 + local iBGP EVPN between the two gateways of a DC
    - endpoints: ["marpla-dc-1-s01:eth9", "marpla-dc-1-s02:eth9"]
    - endpoints: ["marpla-dc-2-s01:eth9", "marpla-dc-2-s02:eth9"]
    # DCI: 4 links between DC1 and DC2 spines
    - endpoints: ["marpla-dc-1-s01:eth7", "marpla-dc-2-s01:eth7"]
    - endpoints: ["marpla-dc-1-s01:eth8", "marpla-dc-2-s02:eth8"]
    - endpoints: ["marpla-dc-1-s02:eth7", "marpla-dc-2-s02:eth7"]
    - endpoints: ["marpla-dc-1-s02:eth8", "marpla-dc-2-s01:eth8"]
