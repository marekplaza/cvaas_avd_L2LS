hostname marpla-dc-2-fw01
!
no aaa root
!
username arista privilege 15 role network-admin secret arista
!
alias test
   10 ping 10.2.10.1 repeat 2
   20 ping 10.2.10.11 repeat 2
   30 ping 10.3.10.1 repeat 2
   40 ping 10.3.10.11 repeat 2
   50 ping 10.1.10.1 repeat 2
   60 ping 10.1.10.11 repeat 2
   70 ping 10.3.99.11 repeat 2
!
service routing protocols model multi-agent
!
vrf instance MGMT
!
vlan 110
!
vlan 122
!
vlan 210
!
vlan 222
!
vlan 310
!
vlan 322
!
vlan 399
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description WEW_leaf-a
   channel-group 1 mode active
!
interface Ethernet2
   description WEW_leaf-b
   channel-group 1 mode active
!
interface Port-Channel1
   description FW_WEW
   switchport mode trunk
   switchport trunk allowed vlan 210,222
!
interface Ethernet3
   description PRIV_leaf-a
   channel-group 2 mode active
!
interface Ethernet4
   description PRIV_leaf-b
   channel-group 2 mode active
!
interface Port-Channel2
   description FW_PRIV
   switchport mode trunk
   switchport trunk allowed vlan 310,322,399
!
interface Ethernet5
   description EXT_leaf-a
   channel-group 3 mode active
!
interface Ethernet6
   description EXT_leaf-b
   channel-group 3 mode active
!
interface Port-Channel3
   description FW_EXT
   switchport mode trunk
   switchport trunk allowed vlan 110,122
!
interface Vlan210
   description WEW_FW_stretched
   ip address 10.2.10.12/24
!
interface Vlan222
   description WEW_DC2_LOCAL
   ip address 10.2.22.12/24
!
interface Vlan310
   description PRIV_FW_stretched
   ip address 10.3.10.12/24
!
interface Vlan322
   description PRIV_DC2_LOCAL
   ip address 10.3.22.12/24
!
interface Vlan110
   description EXT_FW_stretched
   ip address 10.1.10.12/24
!
interface Vlan122
   description EXT_DC2_LOCAL
   ip address 10.1.22.12/24
!
interface Vlan399
   description FW_HA_stretched
   ip address 10.3.99.12/24
!
interface Management1
   vrf MGMT
   ip address 10.30.29.1/16
!
ip route vrf MGMT 0.0.0.0/0 10.30.0.1
!
end
